  <script type="text/babel">
    // ─── FIREBASE CONFIGURATION & INITIALIZATION ─────────────────────────────────

    const { useState, useEffect, useCallback, useRef, useMemo } = React;

    // ─── CONSTANTS ────────────────────────────────────────────────────────────────
    const MONTHS_ES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    const DAYS_ES = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

    const DEFAULT_ITEMS = [

      { id: 'h7', name: 'Gym - Triceps', category: 'salud', hasValue: false },
      { id: 'h8', name: 'Km', category: 'salud', hasValue: true },
      { id: 'h9', name: 'Kg', category: 'salud', hasValue: true },
      { id: 'h10', name: '$', category: 'finanzas', hasValue: true },
    ];

    const DEFAULT_TASKS = [
      { id: 't1', name: 'Revisión de diseño UI', category: 'trabajo', priority: 'urgentes', done: false, createdAt: '2026-05-12', checklist: [] },
      { id: 't2', name: 'Actualizar repositorio', category: 'proyecto', priority: 'importantes', done: true, createdAt: '2026-05-10', checklist: [] },

      { id: 't5', name: 'Revisar pipeline CI/CD', category: 'proyecto', priority: 'importantes', done: false, createdAt: '2026-05-11', checklist: [] },
    ];

    const DEFAULT_CATEGORIES = [
      { id: 'personal', name: 'Personal', color: '#10b981' }, // emerald-500
      { id: 'trabajo', name: 'Trabajo', color: '#3b82f6' }, // blue-500
      { id: 'salud', name: 'Salud', color: '#ef4444' }, // red-500
      { id: 'finanzas', name: 'Finanzas', color: '#f59e0b' }, // amber-500
      { id: 'proyecto', name: 'Proyecto', color: '#8b5cf6' }, // violet-500
    ];

    const INITIAL_STATE = {
      categories: DEFAULT_CATEGORIES,
      items: DEFAULT_ITEMS,
      history: {},
      tasks: DEFAULT_TASKS,
      theme: 'light',
      year: new Date().getFullYear(),
      month: new Date().getMonth(),
      progressBarColor: '#ffddb8',
      lastReportedMonth: '',
      notificationsEnabled: false,
      lastNotificationDate: '',
    };

    // Función para calcular cantidad de tareas Urgentes y Vencidas
    function getTaskAlerts(tasks) {
      const pending = (tasks || []).filter(t => !t.done);
      const urgentes = pending.filter(t => t.priority === 'urgentes');
      const vencidas = pending.filter(t => {
        const ageDays = Math.floor((Date.now() - new Date(t.createdAt)) / 86400000);
        const isOverdueUrgente = t.priority === 'urgentes' && ageDays > 2;
        const isOverdueImportante = t.priority === 'importantes' && ageDays > 10;
        return isOverdueUrgente || isOverdueImportante;
      });
      return { urgentesCount: urgentes.length, vencidasCount: vencidas.length };
    }

    // Lanzar notificación nativa
    function triggerLocalNotification(state) {
      if (!("Notification" in window)) {
        alert("Este navegador no soporta notificaciones de escritorio.");
        return;
      }
      if (Notification.permission === "granted") {
        const alerts = getTaskAlerts(state.tasks);
        if (alerts.urgentesCount > 0 || alerts.vencidasCount > 0) {
          new Notification("Resumen de Tareas - Productive.app", {
            body: `Tienes ${alerts.urgentesCount} tareas urgentes y ${alerts.vencidasCount} vencidas pendientes hoy.`,
            icon: "app_logo.png"
          });
        } else {
          new Notification("¡Todo al día! - Productive.app", {
            body: "No tienes tareas urgentes ni vencidas pendientes para hoy.",
            icon: "app_logo.png"
          });
        }
      } else {
        alert("Por favor, habilita los permisos de notificación primero.");
      }
    }

    // Función para descargar reporte en formato .txt
    function downloadReportForMonth(state, reportYear, reportMonth) {
      const { items, history, tasks } = state;
      const reportDays = getDaysInMonth(reportYear, reportMonth);
      const monthName = MONTHS_ES[reportMonth];
      let text = `=========================================\n`;
      text += `   REPORTE DE PRODUCTIVIDAD - ${monthName.toUpperCase()} ${reportYear}\n`;
      text += `=========================================\n\n`;

      // Hitos
      text += `📈 RESUMEN DE HITOS:\n`;
      text += `-----------------------------------------\n`;
      items.forEach(it => {
        let total = 0;
        let daysCompleted = 0;
        for (let d = 1; d <= reportDays; d++) {
          const key = formatKey(reportYear, reportMonth, d);
          const v = history[key]?.[it.id];
          if (v !== undefined && v !== null && v !== false && v !== '') {
            if (it.hasValue && typeof v === 'string') {
              const n = parseFloat(v.replace(/[^\d.-]/g, ''));
              if (!isNaN(n)) total += n; else total++;
            } else {
              total++;
            }
            daysCompleted++;
          }
        }
        const goal = Number(it.goalValue);
        const hasGoal = !isNaN(goal) && goal > 0;
        let pct = 0;
        if (it.hasValue) {
          const maxVal = hasGoal ? goal : Math.max(total, 1);
          pct = Math.min(Math.round((total / maxVal) * 100), 100);
          text += `* ${it.name}: Total ${total} ${hasGoal ? `(Meta: ${goal})` : ''} - [${pct}% completado]\n`;
        } else {
          const maxVal = hasGoal ? goal : reportDays;
          pct = Math.min(Math.round((daysCompleted / maxVal) * 100), 100);
          text += `* ${it.name}: ${daysCompleted}/${reportDays} días ${hasGoal ? `(Meta: ${goal})` : ''} - [${pct}% completado]\n`;
        }
      });

      // Tareas
      text += `\n✅ RESUMEN DE TAREAS:\n`;
      text += `-----------------------------------------\n`;
      const monthTasks = (tasks || []).filter(t => {
        const prefix = `${reportYear}-${String(reportMonth + 1).padStart(2, '0')}`;
        return t.createdAt && t.createdAt.startsWith(prefix);
      });

      const completedTasks = monthTasks.filter(t => t.done);
      const pendingTasks = monthTasks.filter(t => !t.done);
      text += `Total de tareas creadas este mes: ${monthTasks.length}\n`;
      text += `  - Completadas: ${completedTasks.length}\n`;
      text += `  - Pendientes: ${pendingTasks.length}\n\n`;

      if (monthTasks.length > 0) {
        text += `Detalle de tareas:\n`;
        monthTasks.forEach(t => {
          text += `[${t.done ? 'X' : ' '}] (${t.priority.toUpperCase()}) ${t.name}\n`;
          if (t.description) text += `    Nota: ${t.description}\n`;
          if (t.checklist && t.checklist.length > 0) {
            t.checklist.forEach(chk => {
              text += `      - [${chk.done ? 'x' : ' '}] ${chk.text}\n`;
            });
          }
        });
      } else {
        text += `Sin tareas registradas en este período.\n`;
      }

      text += `\n=========================================\n`;
      text += `Generado el ${new Date().toLocaleDateString('es-ES')} - Productive.app\n`;

      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `reporte_productividad_${monthName.toLowerCase()}_${reportYear}.txt`;
      a.click();
    }

    // ─── STORAGE ─────────────────────────────────────────────────────────────────
    function loadState() {
      try {
        const s = localStorage.getItem('productive_app_v2');
        return s ? { ...INITIAL_STATE, ...JSON.parse(s) } : { ...INITIAL_STATE };
      } catch (e) { return { ...INITIAL_STATE }; }
    }
    function saveState(state) {
      localStorage.setItem('productive_app_v2', JSON.stringify(state));
    }

    // ─── HELPERS ─────────────────────────────────────────────────────────────────
    function getDaysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
    function formatKey(y, m, d) {
      return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

    function computeCompletion(items, history, year, month) {
      const days = getDaysInMonth(year, month);
      let completed = 0, total = 0;
      for (let d = 1; d <= days; d++) {
        const key = formatKey(year, month, d);
        const dayData = history[key] || {};
        items.forEach(item => {
          total++;
          const v = dayData[item.id];
          if (v !== undefined && v !== null && v !== false && v !== '') completed++;
        });
      }
      return total > 0 ? Math.round((completed / total) * 100) : 0;
    }

    // ─── PROGRESS RING ────────────────────────────────────────────────────────────
    function ProgressRing({ pct, size = 80, strokeWidth = 8, label }) {
      const r = (size - strokeWidth) / 2;
      const circ = 2 * Math.PI * r;
      const offset = circ * (1 - pct / 100);
      return (
        <div className="relative flex items-center justify-center" style={{ width: size, height: size }}>
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
            <circle cx={size / 2} cy={size / 2} r={r} fill="transparent"
              stroke="currentColor" strokeWidth={strokeWidth}
              className="text-outline-variant/30" />
            <circle cx={size / 2} cy={size / 2} r={r} fill="transparent"
              stroke="currentColor" strokeWidth={strokeWidth}
              className="text-primary progress-ring__circle"
              strokeDasharray={circ} strokeDashoffset={offset}
              strokeLinecap="round" />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center">
            <span className="font-bold text-[13px] leading-none text-primary">{pct}%</span>
            {label && <span className="text-[9px] text-on-surface-variant mt-0.5 uppercase tracking-wider">{label}</span>}
          </div>
        </div>
      );
    }

    // ─── TRACKER ─────────────────────────────────────────────────────────────────
    function TrackerTab({ state, dispatch }) {
      const { items, history, year, month } = state;
      const now = new Date();
      const days = getDaysInMonth(year, month);
      const isCurrentMonth = now.getFullYear() === year && now.getMonth() === month;

      const [valueModal, setValueModal] = useState(null); // { dateStr, item }
      const [valueInput, setValueInput] = useState('');
      const [editItem, setEditItem] = useState(null);
      const [draggedIndex, setDraggedIndex] = useState(null);
      const [newItemModal, setNewItemModal] = useState(false);
      const [newItemForm, setNewItemForm] = useState({ name: '', hasValue: false, goalValue: '' });
      const inputRef = useRef(null);
      const scrollContainerRef = useRef(null);

      const progressByItem = useMemo(() => {
        return items.map(it => {
          let total = 0;
          for (let d = 1; d <= days; d++) {
            const key = formatKey(year, month, d);
            const v = history[key]?.[it.id];
            if (v !== undefined && v !== null && v !== false && v !== '') {
              if (it.hasValue && typeof v === 'string') {
                const n = parseFloat(v.replace(/[^\d.-]/g, ''));
                if (!isNaN(n)) total += n; else total++;
              } else total++;
            }
          }
          const goal = Number(it.goalValue);
          const hasGoal = !isNaN(goal) && goal > 0;
          let maxPossible;
          if (it.hasValue) {
            maxPossible = hasGoal ? goal : Math.max(total, 1);
          } else {
            maxPossible = hasGoal ? goal : days;
          }
          return { id: it.id, pct: Math.min(Math.round((total / maxPossible) * 100), 100) };
        });
      }, [items, history, year, month, days]);

      useEffect(() => {
        if (isCurrentMonth && scrollContainerRef.current) {
          const el = document.getElementById(`day-col-${now.getDate()}`);
          if (el) {
            // center the column
            const container = scrollContainerRef.current;
            container.scrollTo({ left: el.offsetLeft - container.clientWidth / 2 + el.clientWidth / 2, behavior: 'smooth' });
          }
        }
      }, [isCurrentMonth]);

      const getVal = (dateStr, itemId) => {
        return history[dateStr]?.[itemId] ?? null;
      };
      const isCompleted = v => v !== undefined && v !== null && v !== false && v !== '';

      const handleCellClick = (dateStr, item) => {
        const [y, m, d] = dateStr.split('-').map(Number);
        const cellDate = new Date(y, m - 1, d);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        if (cellDate > today) return; // Cannot edit future days

        if (item.hasValue) {
          const cur = getVal(dateStr, item.id);
          setValueInput(cur === true ? '' : (cur || ''));
          setValueModal({ dateStr, item });
          setTimeout(() => inputRef.current?.focus(), 80);
        } else {
          const cur = getVal(dateStr, item.id);
          dispatch({ type: 'SET_HISTORY', dateStr, itemId: item.id, value: cur === true ? false : true });
        }

    // ─── TASKS ───────────────────────────────────────────────────────────────────
    function TasksTab({ state, dispatch }) {
      const { tasks } = state;
      const [search, setSearch] = useState('');
      const [filterCat, setFilterCat] = useState('todas');
      const [filterPri, setFilterPri] = useState('todas');
      const [showAdd, setShowAdd] = useState(false);
      const [draggedIndex, setDraggedIndex] = useState(null);
      const [newTask, setNewTask] = useState({ name: '', category: state.categories?.[0]?.id || 'trabajo', priority: 'urgentes', description: '', checklist: [] });
      const [newChecklistItemText, setNewChecklistItemText] = useState('');
      const [editTaskItem, setEditTaskItem] = useState(null);
      const [editChecklistItemText, setEditChecklistItemText] = useState('');
      const [expandedTasks, setExpandedTasks] = useState({});
      const [showCategoryManager, setShowCategoryManager] = useState(false);
      const [editingCategory, setEditingCategory] = useState(null);
      const categories = state.categories || DEFAULT_CATEGORIES;

      const handleMoveTask = (filteredFromIndex, filteredToIndex) => {
        const fromTask = filtered[filteredFromIndex];
        const toTask = filtered[filteredToIndex];
        if (!fromTask || !toTask) return;
        const actualFromIndex = state.tasks.findIndex(t => t.id === fromTask.id);
        const actualToIndex = state.tasks.findIndex(t => t.id === toTask.id);
        dispatch({ type: 'MOVE_TASK', fromIndex: actualFromIndex, toIndex: actualToIndex });
      };

      const filtered = useMemo(() => {
        return tasks.filter(t => {
          if (search && !t.name.toLowerCase().includes(search.toLowerCase())) return false;
          if (filterCat !== 'todas' && t.category !== filterCat) return false;
          if (filterPri !== 'todas' && t.priority !== filterPri) return false;
          return true;
        });
      }, [tasks, search, filterCat, filterPri]);

      const distrib = useMemo(() => {
        const pending = tasks.filter(t => !t.done);
        const dist = {};
        categories.forEach(c => dist[c.id] = 0);
        pending.forEach(t => {
          if (dist[t.category] !== undefined) dist[t.category]++;
        });
        return dist;
      }, [tasks, categories]);

      const totalPending = Object.values(distrib).reduce((a, b) => a + b, 0);
      const maxDist = Math.max(...Object.values(distrib), 1);

      const addTask = () => {
        if (!newTask.name.trim()) return;
        dispatch({ type: 'ADD_TASK', task: { id: uid(), ...newTask, done: false, createdAt: new Date().toISOString().slice(0, 10) } });
        setNewTask({ name: '', category: categories[0]?.id || 'trabajo', priority: 'urgentes', description: '', checklist: [] });
        setNewChecklistItemText('');
        setShowAdd(false);
      };

      const addChecklistItemToNew = () => {
        if (!newChecklistItemText.trim()) return;
        setNewTask({ ...newTask, checklist: [...(newTask.checklist || []), { id: uid(), text: newChecklistItemText.trim(), done: false }] });
        setNewChecklistItemText('');
      };

      const removeChecklistItemFromNew = (id) => {
        setNewTask({ ...newTask, checklist: newTask.checklist.filter(c => c.id !== id) });
      };

      const saveEditTask = () => {
        if (!editTaskItem.name.trim()) return;
        dispatch({ type: 'EDIT_TASK', task: editTaskItem });
        setEditTaskItem(null);
        setEditChecklistItemText('');
      };

      const addChecklistItemToEdit = () => {
        if (!editChecklistItemText.trim()) return;
        setEditTaskItem({ ...editTaskItem, checklist: [...(editTaskItem.checklist || []), { id: uid(), text: editChecklistItemText.trim(), done: false }] });
        setEditChecklistItemText('');
      };

      const removeChecklistItemFromEdit = (id) => {
        setEditTaskItem({ ...editTaskItem, checklist: editTaskItem.checklist.filter(c => c.id !== id) });
      };

      const toggleExpand = (id) => {
        setExpandedTasks(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const saveCategory = () => {
        if (!editingCategory.name.trim()) return;
        if (editingCategory.isNew) {
          dispatch({ type: 'ADD_CATEGORY', category: { id: uid(), name: editingCategory.name, color: editingCategory.color } });
        } else {
          dispatch({ type: 'EDIT_CATEGORY', category: editingCategory });
        }
        setEditingCategory(null);
      };

      const deleteCategory = (id) => {
        if (confirm('¿Seguro que deseas eliminar esta categoría?')) {
          dispatch({ type: 'DELETE_CATEGORY', categoryId: id });
        }
      };

      const catChips = [
        { id: 'todas', label: 'Todas' },
        ...categories.map(c => ({ id: c.id, label: c.name }))
      ];
      const priChips = [
        { id: 'todas', label: 'Todas' },
        { id: 'urgentes', label: 'Urgentes' },
        { id: 'importantes', label: 'Importantes' },
        { id: 'otras', label: 'Otras' },
      ];

      const priorityBadge = (p) => {
        if (p === 'urgentes') return 'bg-secondary-fixed/60 text-on-secondary-fixed';
        if (p === 'importantes') return 'bg-primary-fixed/60 text-on-primary-fixed';
        return 'bg-surface-container-high text-on-surface-variant';
      };

      const renderTaskItem = (task, index, taskCategory) => {
        const isDragged = index !== null && draggedIndex === index;
        const ageDays = Math.floor((Date.now() - new Date(task.createdAt)) / 86400000);
        const isOverdueUrgente = task.priority === 'urgentes' && ageDays > 2;
        const isOverdueImportante = task.priority === 'importantes' && ageDays > 10;
        const isOverdue = !task.done && (isOverdueUrgente || isOverdueImportante);
        const taskBgClass = isOverdue ? 'bg-error-container/30 border-error/50' : 'bg-surface-container-lowest border-outline-variant/20';

        return (
          <div key={task.id}
            draggable={filterCat !== 'todas'}
            onDragStart={(e) => {
              if (filterCat === 'todas') return;
              setDraggedIndex(index);
              e.dataTransfer.effectAllowed = "move";
            }}
            onDragOver={(e) => { e.preventDefault(); }}
            onDragEnter={(e) => {
              if (filterCat === 'todas') return;
              if (draggedIndex !== null && draggedIndex !== index) {
                handleMoveTask(draggedIndex, index);
                setDraggedIndex(index);
              }
            }}
            onDragEnd={() => setDraggedIndex(null)}

    // ─── EVOLUTION ────────────────────────────────────────────────────────────────
    function EvolutionTab({ state }) {
      const { items, history, year } = state;
      const [openMonth, setOpenMonth] = useState(new Date().getMonth());

      const getColorForPercentage = (pct) => {
        if (pct < 30) return 'bg-error text-on-error';
        if (pct < 50) return 'bg-[#f97316] text-white'; // orange-500
        if (pct < 75) return 'bg-[#eab308] text-white'; // yellow-500
        return 'bg-[#22c55e] text-white'; // green-500
      };

      const renderHabitTracker = (item, monthIdx) => {
        const daysInMonth = getDaysInMonth(year, monthIdx);
        
        // Split days into rows of 7
        const rows = [];
        let currentRow = [];
        for (let d = 1; d <= daysInMonth; d++) {
          currentRow.push(d);
          if (currentRow.length === 7 || d === daysInMonth) {
            rows.push(currentRow);
            currentRow = [];
          }
        }

        // Calculate values per day
        const goal = Number(item.goalValue);
        const hasGoal = !isNaN(goal) && goal > 0;

        const dayValues = {};
        let monthTotal = 0;
        let monthGoalTotal = 0;

        // If goal is the monthly goal:
        // The daily goal is goal / daysInMonth
        const dailyGoal = hasGoal ? goal / daysInMonth : 1;

        for (let d = 1; d <= daysInMonth; d++) {
          const key = formatKey(year, monthIdx, d);
          const v = history[key]?.[item.id];
          let val = 0;
          if (v !== undefined && v !== null && v !== false && v !== '') {
            if (item.hasValue) {
              let n = typeof v === 'number' ? v : parseFloat(String(v).replace(/[^\d.-]/g, ''));
              val = isNaN(n) ? 1 : n;
            } else {
              val = 1;
            }
          }
          dayValues[d] = val;
          monthTotal += val;
        }

        if (item.hasValue) {
          monthGoalTotal = hasGoal ? goal : Math.max(monthTotal, 1);
        } else {
          monthGoalTotal = daysInMonth; // 1 per day
        }

        const monthPct = Math.min(Math.round((monthTotal / monthGoalTotal) * 100), 100) || 0;

        return (
          <div key={item.id} className="bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-md mb-md flex flex-col md:flex-row gap-6 md:items-center">
            <div className="md:w-1/4">
              <h3 className="text-label-md font-bold text-primary uppercase tracking-wider">{item.name}</h3>
              <p className="text-body-md text-on-surface-variant mt-1">
                Progreso: {Math.round(monthTotal * 10)/10} / {Math.round(monthGoalTotal * 10)/10}
              </p>
            </div>
            
            <div className="flex-1 flex gap-4 items-stretch">
              {/* Rows */}
              <div className="flex-1 flex flex-col gap-2">
                {rows.map((row, rIdx) => {
                  let rowTotal = 0;
                  row.forEach(d => rowTotal += dayValues[d]);
                  
                  let rowGoal = 0;
                  if (item.hasValue) {
                    rowGoal = hasGoal ? dailyGoal * row.length : Math.max(rowTotal, 1);
                  } else {
                    rowGoal = row.length;
                  }
                  const rowPct = Math.min(Math.round((rowTotal / rowGoal) * 100), 100) || 0;

                  return (
                    <div key={rIdx} className="flex items-center gap-3">
                      <div className="flex flex-1 items-center justify-between bg-surface-container/30 rounded-full px-2 py-1.5">
                        {row.map(d => {
                          const val = dayValues[d];
                          const isMet = val > 0;
                          return (
                            <div key={d} 
                                 title={`Día ${d}: ${val}`}
                                 className={`w-7 h-7 md:w-8 md:h-8 rounded-full flex items-center justify-center text-[11px] font-bold transition-colors ${
                                   isMet ? 'bg-primary text-on-primary shadow-sm' : 'bg-surface-container-high text-on-surface-variant'
                                 }`}>
                              {d}
                            </div>
                          );
                        })}
                        {/* Fill empty spaces in the last row if < 7 */}
                        {Array.from({ length: 7 - row.length }).map((_, i) => (
                          <div key={`empty-${i}`} className="w-7 h-7 md:w-8 md:h-8"></div>
                        ))}
                      </div>
                      <div className={`w-11 h-11 md:w-12 md:h-12 shrink-0 rounded-full flex items-center justify-center text-[12px] font-bold shadow-sm ${getColorForPercentage(rowPct)}`}>
                        {item.hasValue ? Math.round(rowTotal * 10) / 10 : `${rowPct}%`}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Monthly vertical bar */}
              <div className="relative w-12 md:w-16 shrink-0 rounded-[2rem] bg-surface-container/60 border border-outline-variant/30 overflow-hidden shadow-sm flex items-center justify-center">
                <div 
                  className={`absolute bottom-0 left-0 right-0 w-full transition-all duration-500 ${getColorForPercentage(monthPct).split(' ')[0]}`} 
                  style={{ height: `${monthPct}%` }}
                />
                <span className={`relative z-10 text-label-md md:text-label-lg font-bold transform -rotate-90 origin-center whitespace-nowrap transition-colors duration-300 ${monthPct > 45 ? 'text-white' : 'text-primary'}`}>
                  {monthPct}%
                </span>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="tab-content space-y-lg">
          <header className="border-b border-outline-variant/30 pb-4">
            <p className="font-mono text-[10px] tracking-widest text-on-surface-variant/60 uppercase mb-1">PÁG. 4</p>
            <h1 className="text-headline-lg-mobile md:text-headline-lg font-bold text-primary tracking-tight">Evolución</h1>
          </header>

          <div className="space-y-sm pb-8">
            {MONTHS_ES.map((monthName, mIdx) => {
              const isOpen = openMonth === mIdx;
              return (
                <div key={mIdx} className="border border-outline-variant/30 rounded-xl overflow-hidden bg-surface-container-lowest shadow-sm transition-all">
                  <button 
                    onClick={() => setOpenMonth(isOpen ? -1 : mIdx)}
                    className="w-full flex items-center justify-between p-4 bg-surface-container hover:bg-surface-container-high transition-colors text-primary"
                  >
                    <span className="text-label-lg font-bold uppercase tracking-widest">{monthName} {year}</span>
                    <span className={`material-symbols-outlined transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`}>
                      expand_more
                    </span>
                  </button>
                  {isOpen && (
                    <div className="p-4 md:p-6 bg-background">
                      {items.length === 0 ? (
                        <p className="text-body-md text-on-surface-variant/60 text-center py-4">No hay metas registradas.</p>
                      ) : (
                        items.map(item => renderHabitTracker(item, mIdx))

                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─── REDUCER ─────────────────────────────────────────────────────────────────
    function reducer(state, action) {
      switch (action.type) {
        case 'SET_HISTORY': {
          const h = { ...state.history };
          if (!h[action.dateStr]) h[action.dateStr] = {};
          else h[action.dateStr] = { ...h[action.dateStr] };
          h[action.dateStr][action.itemId] = action.value;
          return { ...state, history: h };
        }
        case 'ADD_ITEM': return { ...state, items: [...state.items, action.item] };
        case 'EDIT_ITEM': return { ...state, items: state.items.map(i => i.id === action.item.id ? action.item : i) };
        case 'DELETE_ITEM': return { ...state, items: state.items.filter(i => i.id !== action.itemId) };
        case 'MOVE_ITEM': {
          const { fromIndex, toIndex } = action;
          if (toIndex < 0 || toIndex >= state.items.length) return state;
          const items = [...state.items];
          const [moved] = items.splice(fromIndex, 1);
          items.splice(toIndex, 0, moved);
          return { ...state, items };
        }
        case 'ADD_TASK': return { ...state, tasks: [action.task, ...state.tasks] };
        case 'EDIT_TASK': return { ...state, tasks: state.tasks.map(t => t.id === action.task.id ? action.task : t) };
        case 'TOGGLE_TASK': return { ...state, tasks: state.tasks.map(t => t.id === action.taskId ? { ...t, done: !t.done } : t) };
        case 'TOGGLE_TASK_TODAY': return { ...state, tasks: state.tasks.map(t => t.id === action.taskId ? { ...t, isToday: !t.isToday } : t) };
        case 'TOGGLE_TASK_CHECKLIST_ITEM': {
          const { taskId, itemId } = action;
          return {
            ...state,
            tasks: state.tasks.map(t => {
              if (t.id === taskId) {
                const checklist = t.checklist ? [...t.checklist] : [];
                const idx = checklist.findIndex(c => c.id === itemId);
                if (idx >= 0) checklist[idx] = { ...checklist[idx], done: !checklist[idx].done };
                return { ...t, checklist };
              }
              return t;
            })
          };
        }
        case 'DELETE_TASK': return { ...state, tasks: state.tasks.filter(t => t.id !== action.taskId) };
        case 'MOVE_TASK': {
          const { fromIndex, toIndex } = action;
          if (toIndex < 0 || toIndex >= state.tasks.length) return state;
          const tasks = [...state.tasks];
          const [moved] = tasks.splice(fromIndex, 1);
          tasks.splice(toIndex, 0, moved);
          return { ...state, tasks };
        }
        case 'ADD_CATEGORY': return { ...state, categories: [...(state.categories || DEFAULT_CATEGORIES), action.category] };
        case 'EDIT_CATEGORY': return { ...state, categories: (state.categories || DEFAULT_CATEGORIES).map(c => c.id === action.category.id ? action.category : c) };
        case 'DELETE_CATEGORY': return { ...state, categories: (state.categories || DEFAULT_CATEGORIES).filter(c => c.id !== action.categoryId) };
        case 'PREV_MONTH': {
          let m = state.month - 1, y = state.year;
          if (m < 0) { m = 11; y--; }
          return { ...state, month: m, year: y };
        }
        case 'NEXT_MONTH': {
          let m = state.month + 1, y = state.year;
          if (m > 11) { m = 0; y++; }
          return { ...state, month: m, year: y };
        }
        case 'SET_THEME': {
          const html = document.documentElement;
          if (action.theme === 'dark') html.classList.add('dark'); else html.classList.remove('dark');
          return { ...state, theme: action.theme };
        }
        case 'SET_PROGRESS_COLOR': return { ...state, progressBarColor: action.color };
        case 'SET_LAST_REPORTED_MONTH': return { ...state, lastReportedMonth: action.monthStr };
        case 'SET_NOTIFICATIONS_ENABLED': return { ...state, notificationsEnabled: action.enabled };
        case 'SET_LAST_NOTIFICATION_DATE': return { ...state, lastNotificationDate: action.dateStr };
        case 'IMPORT': return { ...INITIAL_STATE, ...action.data };
        case 'RESET': return { ...INITIAL_STATE };
        default: return state;
      }
    }

    // ─── AUTH MODAL ─────────────────────────────────────────────────────────────
    function AuthModal({ isOpen, onClose }) {
      const [isRegister, setIsRegister] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        if (isOpen) {
          setEmail('');
          setPassword('');
          setError('');
          setLoading(false);
        }
      }, [isOpen]);

      if (!isOpen) return null;

      const handleForgotPassword = () => {
        if (!email.trim()) {
          setError('Por favor, ingresa tu correo electrónico primero para enviarte el enlace de recuperación.');
          return;
        }
        setLoading(true);
        setError('');
        auth.sendPasswordResetEmail(email.trim())
          .then(() => {
            alert(`Se ha enviado un correo para restablecer tu contraseña a: ${email}`);
          })
          .catch(err => {
            console.error("Password reset error:", err);
            setError(`Error al enviar correo: ${err.message}`);
          })
          .finally(() => {
            setLoading(false);
          });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!email.trim() || !password.trim()) {
          setError('Por favor completa todos los campos.');
          return;
        }
        setLoading(true);
        setError('');

        const action = isRegister
          ? auth.createUserWithEmailAndPassword(email, password)
          : auth.signInWithEmailAndPassword(email, password);

        action
          .then(() => {
            onClose();
          })
          .catch(err => {
            console.error("Auth error:", err);
            switch (err.code) {
              case 'auth/email-already-in-use':
                setError('Esta cuenta de correo ya está registrada.');
                break;
              case 'auth/invalid-email':
                setError('El correo electrónico ingresado no es válido.');
                break;
              case 'auth/weak-password':
                setError('La contraseña debe tener al menos 6 caracteres.');
                break;
              case 'auth/wrong-password':
                setError('La contraseña ingresada es incorrecta o el usuario no existe.');
                break;
              case 'auth/user-not-found':
                setError('No existe ninguna cuenta con este correo.');
                break;
              default:
                setError(err.message);
            }
          })
          .finally(() => {
            setLoading(false);
          });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center"
          onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="absolute inset-0 bg-black/40 backdrop-blur-sm animate-fade-in"></div>
          <form onSubmit={handleSubmit}
            className="relative w-full max-w-[400px] bg-surface-container-lowest rounded-t-2xl md:rounded-2xl p-lg border border-outline-variant/30 shadow-2xl mx-auto tab-content">
            <div className="w-10 h-1 rounded-full bg-outline-variant mx-auto mb-lg md:hidden"></div>
            <div className="flex justify-between items-center mb-lg">
              <h3 className="font-bold text-headline-md text-primary">{isRegister ? 'Crear Cuenta Cloud' : 'Iniciar Sesión'}</h3>
              <button type="button" onClick={onClose} className="p-1 rounded-full hover:bg-surface-container transition-colors">
                <span className="material-symbols-outlined text-on-surface-variant">close</span>
              </button>
            </div>

            {error && (
              <div className="bg-error-container/30 border border-error/20 text-error px-md py-sm rounded-xl text-body-md mb-lg">
                {error}
              </div>
            )}

            <div className="space-y-md mb-xl">
              <div>
                <label className="text-label-md text-on-surface-variant block mb-1">Correo Electrónico</label>
                <input
                  type="email"
                  value={email}
                  onChange={e => setEmail(e.target.value)}
                  placeholder="ejemplo@correo.com"
                  required
                  disabled={loading}
                  className="w-full border-b border-outline-variant/50 focus:border-primary bg-transparent py-2 outline-none text-body-lg text-on-surface transition-colors disabled:opacity-50"
                />
              </div>
              <div>
                <label className="text-label-md text-on-surface-variant block mb-1">Contraseña</label>
                <input
                  type="password"
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  placeholder="Mínimo 6 caracteres"
                  required
                  disabled={loading}
                  className="w-full border-b border-outline-variant/50 focus:border-primary bg-transparent py-2 outline-none text-body-lg text-on-surface transition-colors disabled:opacity-50"
                />
                {!isRegister && (
                  <div className="text-right mt-2">
                    <button
                      type="button"
                      onClick={handleForgotPassword}
                      disabled={loading}
                      className="text-label-md text-primary font-semibold hover:underline"
                    >
                      ¿Olvidaste tu contraseña?
                    </button>
                  </div>
                )}
              </div>
            </div>

            <button
              type="submit"
              disabled={loading}
              className="w-full bg-primary text-on-primary font-bold py-4 rounded-xl active:scale-[0.98] transition-transform shadow-md flex items-center justify-center gap-2 disabled:opacity-50">
              {loading ? (
                <>
                  <span className="animate-spin material-symbols-outlined text-[20px]">sync</span>
                  {isRegister ? 'Creando cuenta...' : 'Iniciando sesión...'}
                </>
              ) : (
                <>
                  <span className="material-symbols-outlined text-[20px]">{isRegister ? 'person_add' : 'login'}</span>
                  {isRegister ? 'Crear Cuenta' : 'Entrar'}
                </>
              )}
            </button>

            <p className="text-center text-body-md text-on-surface-variant/70 mt-lg">
              {isRegister ? '¿Ya tienes una cuenta?' : '¿No tienes una cuenta aún?'}
              <button
                type="button"
                disabled={loading}
                onClick={() => { setIsRegister(!isRegister); setError(''); }}
                className="text-primary font-bold ml-1.5 hover:underline disabled:opacity-50">
                {isRegister ? 'Inicia Sesión' : 'Regístrate aquí'}
              </button>
            </p>
          </form>
        </div>
      );
    }

    // ─── APP ─────────────────────────────────────────────────────────────────────
    function App() {
      const [tab, setTab] = useState('home');
      const [state, dispatch] = React.useReducer(reducer, null, loadState);

      // Firebase states
      const [user, setUser] = useState(null);
      const [syncing, setSyncing] = useState(false);
      const [dbLoading, setDbLoading] = useState(false);
      const [authModal, setAuthModal] = useState(false);

      // Notificaciones automáticas de tareas al iniciar el día
      useEffect(() => {
        if (!state || !state.notificationsEnabled) return;
        
        const now = new Date();
        const todayStr = formatKey(now.getFullYear(), now.getMonth(), now.getDate());

        if (state.lastNotificationDate !== todayStr && Notification.permission === "granted") {
          const alerts = getTaskAlerts(state.tasks);
          if (alerts.urgentesCount > 0 || alerts.vencidasCount > 0) {
            new Notification("Resumen diario de tareas", {
              body: `Hoy tienes ${alerts.urgentesCount} tareas urgentes y ${alerts.vencidasCount} vencidas pendientes.`,
              icon: "app_logo.png"
            });
            dispatch({ type: 'SET_LAST_NOTIFICATION_DATE', dateStr: todayStr });
          }
        }
      }, [state?.tasks, state?.notificationsEnabled, state?.lastNotificationDate]);

      // Alerta de fin de mes automática
      useEffect(() => {
        if (!state) return;
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth();

        // Obtener el mes anterior
        let prevMonth = currentMonth - 1;
        let prevYear = currentYear;
        if (prevMonth < 0) {
          prevMonth = 11;
          prevYear--;
        }

        const prevMonthStr = `${prevYear}-${String(prevMonth + 1).padStart(2, '0')}`;
        
        // Si no se ha reportado el mes anterior y el usuario tiene historial de ese mes
        if (state.lastReportedMonth !== prevMonthStr) {
          let hasData = false;
          const reportDays = getDaysInMonth(prevYear, prevMonth);
          for (let d = 1; d <= reportDays; d++) {
            const key = formatKey(prevYear, prevMonth, d);
            if (state.history[key] && Object.keys(state.history[key]).length > 0) {
              hasData = true;
              break;
            }
          }

          if (hasData) {
            setTimeout(() => {
              const confirmReport = confirm(`¡Ha finalizado el mes de ${MONTHS_ES[prevMonth]} ${prevYear}! ¿Deseas descargar el reporte de productividad de ese mes?`);
              if (confirmReport) {
                downloadReportForMonth(state, prevYear, prevMonth);
              }
              dispatch({ type: 'SET_LAST_REPORTED_MONTH', monthStr: prevMonthStr });
            }, 2000);
          } else {
            // Si no hay datos, marcarlo silenciosamente como reportado para no molestar
            dispatch({ type: 'SET_LAST_REPORTED_MONTH', monthStr: prevMonthStr });
          }
        }
      }, [state?.history]);

      // Persist to localStorage
      useEffect(() => { saveState(state); }, [state]);

      // Apply theme on load
      useEffect(() => {
        if (state.theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, []);

      // Escuchar cambios de autenticación
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(u => {
          setUser(u);
          if (u) {
            setDbLoading(true);
            db.collection('users').doc(u.uid).get()
              .then(doc => {
                if (doc.exists) {
                  const data = doc.data();
                  setSyncing(true);
                  dispatch({ type: 'IMPORT', data: data });
                  setTimeout(() => setSyncing(false), 1000);
                } else {
                  // Si es un usuario nuevo, guardamos el estado local actual en Firestore
                  db.collection('users').doc(u.uid).set(state)
                    .catch(e => console.error("Error al subir estado inicial:", e));
                }
              })
              .catch(e => console.error("Error al descargar datos de Firestore:", e))
              .finally(() => setDbLoading(false));
          }
        });
        return () => unsubscribe();
      }, []);

      // Sincronizar cambios a Firestore automáticamente (con debounce de 1.5s)
      useEffect(() => {
        if (!user || syncing || dbLoading) return;

        const timer = setTimeout(() => {
          db.collection('users').doc(user.uid).set(state)
            .then(() => console.log("Sincronizado con Firebase Firestore"))
            .catch(e => console.error("Error al sincronizar con Firestore:", e));
        }, 1500);

        return () => clearTimeout(timer);
      }, [state, user, syncing, dbLoading]);

      const forceSync = () => {
        if (!user) return;
        setDbLoading(true);
        db.collection('users').doc(user.uid).set(state)
          .then(() => alert("¡Sincronizado correctamente con la nube!"))
          .catch(e => alert("Error al sincronizar: " + e.message))
          .finally(() => setDbLoading(false));
      };

      const renderTab = () => {
        switch (tab) {
          case 'home': return <HomeTab state={state} dispatch={dispatch} setTab={setTab} />;
          case 'tracker': return <TrackerTab state={state} dispatch={dispatch} />;
          case 'tasks': return <TasksTab state={state} dispatch={dispatch} />;
          case 'evolution': return <EvolutionTab state={state} />;
          case 'settings': return (
            <SettingsTab
              state={state}
              dispatch={dispatch}
              user={user}
              setAuthModal={setAuthModal}
              forceSync={forceSync}
              dbLoading={dbLoading}
            />
          );
          default: return <HomeTab state={state} dispatch={dispatch} setTab={setTab} />;
        }
      };

      return (
        <div className="flex min-h-screen bg-background">
          <Sidebar tab={tab} setTab={setTab} />
          <div className="flex-1 flex flex-col min-h-screen min-w-0">
            {/* Top App Bar (mobile) */}
            <header className="glass border-b border-outline-variant/30 sticky top-0 z-40 flex items-center justify-between px-lg h-16 md:hidden">
              <div>
                <span className="font-bold text-sm text-primary">Productive.app</span>
              </div>
              <div className="flex items-center gap-3">
                <span className="font-mono text-[10px] tracking-widest text-on-surface-variant/60 uppercase">{MONTHS_ES[state.month]} {state.year}</span>
                <div className="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center">
                  <span className="material-symbols-outlined text-[18px] text-on-surface-variant icon-fill">account_circle</span>
                </div>
              </div>
            </header>

            {/* Desktop Top Bar */}
            <header className="hidden md:flex items-center justify-between px-gutter h-20 bg-surface/70 backdrop-blur-xl border-b border-outline-variant/30 sticky top-0 z-40">
              <div>
                <p className="font-mono text-[10px] tracking-widest text-on-surface-variant/60 uppercase">
                  {tab === 'home' ? 'PÁG. 1' : tab === 'tracker' ? 'PÁG. 2' : tab === 'tasks' ? 'PÁG. 3' : tab === 'evolution' ? 'PÁG. 4' : 'PÁG. 5'}
                </p>
                <h1 className="text-headline-lg font-bold text-primary tracking-tight capitalize">
                  {tab === 'home' ? 'Home' : tab === 'tracker' ? 'Tracker' : tab === 'tasks' ? 'Tareas' : tab === 'evolution' ? 'Evolución' : 'Ajustes'}
                </h1>
              </div>
              <div className="flex items-center gap-4">
                <button className="hover:bg-surface-container-high rounded-full p-2 transition-colors">
                  <span className="material-symbols-outlined text-on-surface-variant">search</span>
                </button>
                <div className="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center border border-outline-variant/50">
                  <span className="material-symbols-outlined text-on-surface-variant icon-fill">account_circle</span>
                </div>
              </div>
            </header>

            {/* Main Content */}
            <main className="flex-1 max-w-4xl w-full mx-auto px-md md:px-lg py-lg pb-24 md:pb-12 min-w-0" key={tab}>
              {renderTab()}
            </main>
          </div>

          <BottomNav tab={tab} setTab={setTab} />

          {/* Auth Modal Overlay */}
          <AuthModal isOpen={authModal} onClose={() => setAuthModal(false)} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
