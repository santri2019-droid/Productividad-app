<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const MONTHS_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DAYS_ES   = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

const DEFAULT_ITEMS = [
  { id:'h1', name:'Gracias',       category:'personal', hasValue:false },
  { id:'h2', name:'Gym - Pecho',   category:'salud',    hasValue:false },
  { id:'h3', name:'Gym - Espalda', category:'salud',    hasValue:false },
  { id:'h4', name:'Gym - Pierna',  category:'salud',    hasValue:false },
  { id:'h5', name:'Gym - Hombro',  category:'salud',    hasValue:false },
  { id:'h6', name:'Gym - Biceps',  category:'salud',    hasValue:false },
  { id:'h7', name:'Gym - Triceps', category:'salud',    hasValue:false },
  { id:'h8', name:'Km',            category:'salud',    hasValue:true  },
  { id:'h9', name:'Kg',            category:'salud',    hasValue:true  },
  { id:'h10',name:'$',             category:'finanzas', hasValue:true  },
];

const DEFAULT_TASKS = [
  { id:'t1', name:'Revisión de diseño UI',       category:'trabajo',   priority:'urgentes',   done:false, createdAt:'2026-05-12' },
  { id:'t2', name:'Actualizar repositorio',       category:'proyecto',  priority:'importantes',done:true,  createdAt:'2026-05-10' },
  { id:'t3', name:'Llamar al banco',              category:'personal',  priority:'otras',      done:false, createdAt:'2026-05-13' },
  { id:'t4', name:'Preparar presentación equipo', category:'trabajo',   priority:'urgentes',   done:false, createdAt:'2026-05-14' },
  { id:'t5', name:'Revisar pipeline CI/CD',       category:'proyecto',  priority:'importantes',done:false, createdAt:'2026-05-11' },
];

const INITIAL_STATE = {
  items:   DEFAULT_ITEMS,
  history: {},
  tasks:   DEFAULT_TASKS,
  theme:   'light',
  year:    new Date().getFullYear(),
  month:   new Date().getMonth(),
};

// ─── STORAGE ─────────────────────────────────────────────────────────────────
function loadState() {
  try {
    const s = localStorage.getItem('productive_app_v2');
    return s ? { ...INITIAL_STATE, ...JSON.parse(s) } : { ...INITIAL_STATE };
  } catch { return { ...INITIAL_STATE }; }
}
function saveState(state) {
  localStorage.setItem('productive_app_v2', JSON.stringify(state));
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function getDaysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function formatKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function computeCompletion(items, history, year, month) {
  const days = getDaysInMonth(year, month);
  let completed = 0, total = 0;
  for (let d = 1; d <= days; d++) {
    const key = formatKey(year, month, d);
    const dayData = history[key] || {};
    items.forEach(item => {
      total++;
      const v = dayData[item.id];
      if (v !== undefined && v !== null && v !== false && v !== '') completed++;
    });
  }
  return total > 0 ? Math.round((completed / total) * 100) : 0;
}

// ─── PROGRESS RING ────────────────────────────────────────────────────────────
function ProgressRing({ pct, size = 80, strokeWidth = 8, label }) {
  const r = (size - strokeWidth) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ * (1 - pct / 100);
  return (
    <div className="relative flex items-center justify-center" style={{ width: size, height: size }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={size/2} cy={size/2} r={r} fill="transparent"
          stroke="currentColor" strokeWidth={strokeWidth}
          className="text-outline-variant/30" />
        <circle cx={size/2} cy={size/2} r={r} fill="transparent"
          stroke="currentColor" strokeWidth={strokeWidth}
          className="text-primary progress-ring__circle"
          strokeDasharray={circ} strokeDashoffset={offset}
          strokeLinecap="round" />
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">
        <span className="font-bold text-[13px] leading-none text-primary">{pct}%</span>
        {label && <span className="text-[9px] text-on-surface-variant mt-0.5 uppercase tracking-wider">{label}</span>}
      </div>
    </div>
  );
}

// ─── BOTTOM NAV ──────────────────────────────────────────────────────────────
function BottomNav({ tab, setTab }) {
  const items = [
    { id:'home',    icon:'home',        label:'Home' },
    { id:'tracker', icon:'grid_view',   label:'Hitos' },
    { id:'tasks',   icon:'task_alt',    label:'Tareas' },
    { id:'evolution',icon:'monitoring', label:'Evolución'},
    { id:'settings',icon:'settings',    label:'Ajustes' },
  ];
  return (
    <nav className="fixed bottom-0 left-0 right-0 z-50 glass border-t border-outline-variant/30 flex justify-around items-center h-16 md:hidden"
      style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
      {items.map(item => (
        <button key={item.id}
          onClick={() => setTab(item.id)}
          className={`flex flex-col items-center justify-center px-2 py-1 rounded-xl transition-all active:scale-90 ${
            tab === item.id
              ? 'text-primary font-bold'
              : 'text-on-surface-variant opacity-60'
          }`}>
          <span className={`material-symbols-outlined text-[22px] ${tab === item.id ? 'icon-fill' : ''}`}>
            {item.icon}
          </span>
          <span className="text-[10px] font-medium mt-0.5 leading-none">{item.label}</span>
        </button>
      ))}
    </nav>
  );
}

// ─── DESKTOP SIDEBAR ─────────────────────────────────────────────────────────
function Sidebar({ tab, setTab }) {
  const items = [
    { id:'home',     icon:'home',       label:'Home' },
    { id:'tracker',  icon:'grid_view',  label:'Tracker' },
    { id:'tasks',    icon:'task_alt',   label:'Tareas' },
    { id:'evolution',icon:'monitoring', label:'Evolución' },
    { id:'settings', icon:'settings',   label:'Ajustes' },
  ];
  return (
    <aside className="hidden md:flex flex-col w-64 bg-surface-container-lowest border-r border-outline-variant/30 h-screen sticky top-0 py-lg px-md shrink-0">
      <div className="px-2 mb-xl">
        <div className="flex items-center gap-3">
          <div className="w-7 h-7 rounded-lg bg-primary flex items-center justify-center">
            <span className="text-white font-bold text-sm">P</span>
          </div>
          <span className="font-semibold text-sm tracking-tight text-primary">Productive.app</span>
        </div>
      </div>
      <nav className="flex-1 space-y-1">
        {items.slice(0, -1).map(item => (
          <button key={item.id} onClick={() => setTab(item.id)}
            className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${
              tab === item.id
                ? 'bg-primary text-on-primary'
                : 'text-on-surface-variant hover:bg-surface-container-low hover:text-primary'
            }`}>
            <span className={`material-symbols-outlined text-[20px] ${tab === item.id ? 'icon-fill' : ''}`}>{item.icon}</span>
            {item.label}
          </button>
        ))}
      </nav>
      <div className="mt-auto border-t border-outline-variant/30 pt-4">
        <button onClick={() => setTab('settings')}
          className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${
            tab === 'settings' ? 'bg-primary text-on-primary' : 'text-on-surface-variant hover:bg-surface-container-low hover:text-primary'
          }`}>
          <span className={`material-symbols-outlined text-[20px] ${tab === 'settings' ? 'icon-fill' : ''}`}>settings</span>
          Ajustes
        </button>
      </div>
    </aside>
  );
}

// ─── HOME ─────────────────────────────────────────────────────────────────────
function HomeTab({ state, setTab }) {
  const now = new Date();
  const { items, history, year, month, tasks } = state;

  const dayPct = useMemo(() => {
    const today = now.getDate();
    const key = formatKey(now.getFullYear(), now.getMonth(), today);
    const dayData = history[key] || {};
    const done = items.filter(i => { const v = dayData[i.id]; return v !== undefined && v !== null && v !== false && v !== ''; }).length;
    return items.length > 0 ? Math.round((done / items.length) * 100) : 0;
  }, [items, history]);

  const weekPct = useMemo(() => {
    const dow = now.getDay();
    let done = 0, total = 0;
    for (let i = 0; i <= dow; i++) {
      const d = new Date(now);
      d.setDate(now.getDate() - dow + i);
      const key = formatKey(d.getFullYear(), d.getMonth(), d.getDate());
      const dayData = history[key] || {};
      items.forEach(item => {
        total++;
        const v = dayData[item.id];
        if (v !== undefined && v !== null && v !== false && v !== '') done++;
      });
    }
    return total > 0 ? Math.round((done / total) * 100) : 0;
  }, [items, history]);

  const monthPct = useMemo(() => computeCompletion(items, history, year, month), [items, history, year, month]);

  const yearPct = useMemo(() => {
    let done = 0, total = 0;
    for (let m = 0; m <= now.getMonth(); m++) {
      const days = getDaysInMonth(now.getFullYear(), m);
      for (let d = 1; d <= days; d++) {
        const key = formatKey(now.getFullYear(), m, d);
        const dayData = history[key] || {};
        items.forEach(item => {
          total++;
          const v = dayData[item.id];
          if (v !== undefined && v !== null && v !== false && v !== '') done++;
        });
      }
    }
    return total > 0 ? Math.round((done / total) * 100) : 0;
  }, [items, history]);

  const tasksByPriority = useMemo(() => {
    const pending = tasks.filter(t => !t.done);
    const urgentes   = pending.filter(t => t.priority === 'urgentes');
    const importantes= pending.filter(t => t.priority === 'importantes');
    const otras      = pending.filter(t => t.priority === 'otras');
    return { urgentes, importantes, otras };
  }, [tasks]);

  const streakDays = useMemo(() => {
    let streak = 0;
    const check = new Date();
    while (true) {
      const key = formatKey(check.getFullYear(), check.getMonth(), check.getDate());
      const dayData = history[key] || {};
      const done = items.filter(i => { const v = dayData[i.id]; return v !== undefined && v !== null && v !== false && v !== ''; }).length;
      if (items.length === 0 || done < items.length) break;
      streak++;
      check.setDate(check.getDate() - 1);
    }
    return streak;
  }, [items, history]);

  const metrics = [
    { label: 'AÑO',    pct: yearPct  },
    { label: 'MES',    pct: monthPct },
    { label: 'SEMANA', pct: weekPct  },
    { label: 'DÍA',    pct: dayPct   },
  ];

  return (
    <div className="tab-content space-y-xl">
      {/* Header */}
      <header className="border-b border-outline-variant/30 pb-4">
        <p className="font-mono text-[10px] tracking-widest text-on-surface-variant/60 uppercase mb-1">PÁG. 1</p>
        <h1 className="text-headline-lg-mobile md:text-headline-lg font-bold text-primary tracking-tight">Home</h1>
      </header>

      {/* Streak Card */}
      {streakDays > 0 && (
        <div className="streak-card bg-secondary-container/20 border border-secondary-container/40 rounded-xl p-lg flex items-center justify-between">
          <div>
            <p className="text-label-sm text-on-surface-variant uppercase tracking-widest mb-1">Racha Actual</p>
            <p className="text-headline-md font-bold text-primary">{streakDays} {streakDays === 1 ? 'Día' : 'Días'} Consecutivos</p>
          </div>
          <span className="material-symbols-outlined text-secondary text-[36px] icon-fill">local_fire_department</span>
        </div>
      )}

      {/* Progress Rings */}
      <section>
        <div className="flex items-center gap-2 mb-4">
          <span className="material-symbols-outlined text-on-surface-variant text-[18px]">monitoring</span>
          <h2 className="text-label-sm font-bold tracking-wider text-on-surface-variant uppercase">Métricas de Productividad</h2>
        </div>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-md">
          {metrics.map(m => (
            <div key={m.label}
              className="bg-surface-container-lowest border border-outline-variant/60 rounded-xl p-md flex flex-col items-center justify-center gap-3 h-[120px] transition-all hover:border-outline-variant">
              <span className="text-label-sm font-bold tracking-wider text-on-surface-variant uppercase">{m.label}</span>
              <ProgressRing pct={m.pct} size={72} strokeWidth={7} />
            </div>
          ))}
        </div>
      </section>

      {/* Task Summary */}
      <section>
        <div className="flex items-center justify-between mb-4">
          <div className="flex items-center gap-2">
            <span className="material-symbols-outlined text-on-surface-variant text-[18px]">task_alt</span>
            <h2 className="text-label-sm font-bold tracking-wider text-on-surface-variant uppercase">Resumen de Tareas</h2>
          </div>
          <button onClick={() => setTab('tasks')}
            className="text-label-md text-primary underline underline-offset-4 hover:opacity-70 transition-opacity">
            Ver todo
          </button>
        </div>
        <div className="bg-surface-container-lowest border border-outline-variant/60 rounded-xl overflow-hidden divide-y divide-outline-variant/20">
          {[
            { label:'URGENTES',    count:tasksByPriority.urgentes.length,    days: tasksByPriority.urgentes[0] ? Math.floor((Date.now() - new Date(tasksByPriority.urgentes[0].createdAt)) / 86400000) : 0, bg:'bg-secondary-fixed/60', text:'text-on-secondary-fixed' },
            { label:'IMPORTANTES', count:tasksByPriority.importantes.length, days: tasksByPriority.importantes[0] ? Math.floor((Date.now() - new Date(tasksByPriority.importantes[0].createdAt)) / 86400000) : 0, bg:'bg-primary-fixed/60', text:'text-on-primary-fixed' },
            { label:'OTRAS',       count:tasksByPriority.otras.length,       days: tasksByPriority.otras[0] ? Math.floor((Date.now() - new Date(tasksByPriority.otras[0].createdAt)) / 86400000) : 0, bg:'bg-surface-container-high', text:'text-on-surface-variant' },
          ].map(row => (
            <div key={row.label} className="flex items-center justify-between px-lg py-[14px] hover:bg-surface-container-low transition-colors">
              <div className="flex items-center gap-4">
                <span className={`text-label-sm px-2 py-1 rounded tracking-widest ${row.bg} ${row.text}`}>{row.label}</span>
                <span className="text-display-lg leading-none text-primary font-bold">{row.count}</span>
              </div>
              <div className="flex items-center gap-1.5 text-on-surface-variant/70">
                <span className="material-symbols-outlined text-[18px]">schedule</span>
                <span className="text-body-md">Días: <strong className="text-on-surface">{row.days}</strong></span>
              </div>
            </div>
          ))}
        </div>
      </section>
    </div>
  );
}

// ─── TRACKER ─────────────────────────────────────────────────────────────────
function TrackerTab({ state, dispatch }) {
  const { items, history, year, month } = state;
  const now = new Date();
  const days = getDaysInMonth(year, month);
  const isCurrentMonth = now.getFullYear() === year && now.getMonth() === month;

  const [valueModal, setValueModal] = useState(null); // { dateStr, item }
  const [valueInput, setValueInput] = useState('');
  const [editItem, setEditItem] = useState(null);
  const [newItemModal, setNewItemModal] = useState(false);
  const [newItemForm, setNewItemForm] = useState({ name:'', category:'salud', hasValue:false });
  const inputRef = useRef(null);

  const getVal = (dateStr, itemId) => {
    return history[dateStr]?.[itemId] ?? null;
  };
  const isCompleted = v => v !== undefined && v !== null && v !== false && v !== '';

  const handleCellClick = (dateStr, item) => {
    if (item.hasValue) {
      const cur = getVal(dateStr, item.id);
      setValueInput(cur === true ? '' : (cur || ''));
      setValueModal({ dateStr, item });
      setTimeout(() => inputRef.current?.focus(), 80);
    } else {
      const cur = getVal(dateStr, item.id);
      dispatch({ type:'SET_HISTORY', dateStr, itemId:item.id, value: cur === true ? false : true });
    }
  };

  const saveValue = () => {
    if (!valueModal) return;
    const val = valueInput.trim() === '' ? true : valueInput.trim();
    dispatch({ type:'SET_HISTORY', dateStr:valueModal.dateStr, itemId:valueModal.item.id, value: val });
    setValueModal(null);
  };

  const clearValue = () => {
    if (!valueModal) return;
    dispatch({ type:'SET_HISTORY', dateStr:valueModal.dateStr, itemId:valueModal.item.id, value: false });
    setValueModal(null);
  };

  const saveNewItem = () => {
    if (!newItemForm.name.trim()) return;
    dispatch({ type:'ADD_ITEM', item:{ id:uid(), ...newItemForm } });
    setNewItemModal(false);
    setNewItemForm({ name:'', category:'salud', hasValue:false });
  };

  const saveEditItem = () => {
    if (!editItem || !editItem.name.trim()) return;
    dispatch({ type:'EDIT_ITEM', item:editItem });
    setEditItem(null);
  };

  const deleteItem = () => {
    if (!editItem) return;
    dispatch({ type:'DELETE_ITEM', itemId:editItem.id });
    setEditItem(null);
  };

  return (
    <div className="tab-content">
      {/* Controls */}
      <div className="flex items-center justify-between mb-lg sticky top-0 z-10 py-2 bg-background">
        <div className="flex items-center gap-sm">
          <button onClick={() => dispatch({ type:'PREV_MONTH' })}
            className="p-2 rounded-lg hover:bg-surface-container transition-colors">
            <span className="material-symbols-outlined text-on-surface-variant">chevron_left</span>
          </button>
          <span className="font-semibold text-sm min-w-[120px] text-center text-primary">
            {MONTHS_ES[month]} {year}
          </span>
          <button onClick={() => dispatch({ type:'NEXT_MONTH' })}
            className="p-2 rounded-lg hover:bg-surface-container transition-colors">
            <span className="material-symbols-outlined text-on-surface-variant">chevron_right</span>
          </button>
        </div>
        <button onClick={() => setNewItemModal(true)}
          className="flex items-center gap-1 bg-primary text-on-primary px-md py-sm rounded-lg text-label-md font-medium active:scale-95 transition-transform shadow-sm">
          <span className="material-symbols-outlined text-[18px]">add</span>
          Nuevo Hito
        </button>
      </div>

      {/* Legend */}
      <div className="flex items-center gap-lg py-sm px-md bg-surface-container-low rounded-xl mb-md">
        <div className="flex items-center gap-xs">
          <span className="w-3 h-3 rounded-full bg-success"></span>
          <span className="text-label-md text-on-surface-variant">Logrado</span>
        </div>
        <div className="flex items-center gap-xs">
          <span className="w-3 h-3 rounded-full bg-error/30"></span>
          <span className="text-label-md text-on-surface-variant">Pendiente</span>
        </div>
        <div className="flex items-center gap-xs">
          <span className="w-3 h-3 rounded bg-[#E0F7FA] border border-outline-variant/30"></span>
          <span className="text-label-md text-on-surface-variant">Dato</span>
        </div>
      </div>

      {/* Table */}
      <div className="bg-surface-container-lowest border border-outline-variant/50 rounded-xl overflow-hidden">
        <div className="overflow-x-auto no-scrollbar">
          <table className="border-collapse" style={{ minWidth: `${80 + days * 44}px` }}>
            <thead>
              <tr className="border-b border-outline-variant/30">
                <th className="sticky left-0 bg-surface-container-lowest z-10 px-md py-sm text-left text-label-md text-on-surface-variant uppercase tracking-wider border-r border-outline-variant/20 min-w-[100px] whitespace-nowrap">
                  Hito
                </th>
                {Array.from({ length: days }, (_, i) => {
                  const d = i + 1;
                  const dow = new Date(year, month, d).getDay();
                  const isToday = isCurrentMonth && d === now.getDate();
                  return (
                    <th key={d} className={`px-1 py-sm text-center min-w-[40px] ${isToday ? 'bg-primary' : ''}`}>
                      <div className="flex flex-col items-center gap-0.5">
                        <span className={`text-[10px] font-medium ${isToday ? 'text-on-primary' : 'text-on-surface-variant/60'}`}>{DAYS_ES[dow][0]}</span>
                        <span className={`text-label-md font-bold ${isToday ? 'text-on-primary' : 'text-on-surface-variant'}`}>{d}</span>
                      </div>
                    </th>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {items.map(item => (
                <tr key={item.id} className="border-b border-outline-variant/10 last:border-b-0">
                  <td className="sticky left-0 bg-surface-container-lowest z-10 px-md py-[10px] border-r border-outline-variant/20 whitespace-nowrap">
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-body-md font-medium text-on-surface">{item.name}</span>
                      <button onClick={() => setEditItem({...item})}
                        className="opacity-30 hover:opacity-100 transition-opacity p-0.5 rounded">
                        <span className="material-symbols-outlined text-[16px] text-on-surface-variant">settings</span>
                      </button>
                    </div>
                  </td>
                  {Array.from({ length: days }, (_, i) => {
                    const d = i + 1;
                    const dateStr = formatKey(year, month, d);
                    const v = getVal(dateStr, item.id);
                    const done = isCompleted(v);
                    const isVal = item.hasValue && typeof v === 'string';
                    return (
                      <td key={d} className="px-[3px] py-[6px] text-center">
                        <div className="tracker-cell flex items-center justify-center w-[34px] h-[34px] mx-auto rounded-lg"
                          onClick={() => handleCellClick(dateStr, item)}
                          onDoubleClick={() => { setValueInput(v === true ? '' : (v || '')); setValueModal({ dateStr, item }); }}>
                          {isVal ? (
                            <div className="w-full h-full flex items-center justify-center rounded-lg bg-[#E0F7FA] border border-[#B2EBF2]">
                              <span className="text-[10px] font-bold text-[#006064] leading-none">{v}</span>
                            </div>
                          ) : done ? (
                            <span className="material-symbols-outlined text-success text-[22px] icon-fill">check_circle</span>
                          ) : (
                            <span className="material-symbols-outlined text-error/30 text-[22px]">circle</span>
                          )}
                        </div>
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Value Modal */}
      {valueModal && (
        <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center"
          onClick={e => { if (e.target === e.currentTarget) setValueModal(null); }}>
          <div className="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
          <div className="relative w-full max-w-[400px] bg-surface-container-lowest rounded-t-2xl md:rounded-2xl p-lg border border-outline-variant/30 shadow-2xl mx-auto">
            <div className="w-10 h-1 rounded-full bg-outline-variant mx-auto mb-lg md:hidden"></div>
            <h3 className="font-headline-md text-primary mb-1">Registrar Valor</h3>
            <p className="text-label-md text-on-surface-variant mb-lg">{valueModal.item.name} · {valueModal.dateStr}</p>
            <input ref={inputRef}
              type="text"
              value={valueInput}
              onChange={e => setValueInput(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') saveValue(); if (e.key === 'Escape') setValueModal(null); }}
              placeholder="Ej: 5.2, 80, completado..."
              className="w-full border-b-2 border-outline-variant/50 focus:border-primary bg-transparent py-2 outline-none text-body-lg text-on-surface placeholder:text-outline/50 mb-lg transition-colors" />
            <div className="flex gap-sm">
              <button onClick={clearValue}
                className="flex-1 py-3 border border-error/30 text-error rounded-xl text-label-md font-medium hover:bg-error-container/20 transition-colors active:scale-95">
                Limpiar
              </button>
              <button onClick={() => setValueModal(null)}
                className="flex-1 py-3 border border-outline-variant/50 rounded-xl text-label-md font-medium text-on-surface-variant hover:bg-surface-container transition-colors active:scale-95">
                Cancelar
              </button>
              <button onClick={saveValue}
                className="flex-1 py-3 bg-primary text-on-primary rounded-xl text-label-md font-bold shadow-sm active:scale-95 transition-transform">
                Guardar
              </button>
            </div>
          </div>
        </div>
      )}

      {/* New Item Modal */}
      {newItemModal && (
        <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center"
          onClick={e => { if (e.target === e.currentTarget) setNewItemModal(false); }}>
          <div className="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
          <div className="relative w-full max-w-[400px] bg-surface-container-lowest rounded-t-2xl md:rounded-2xl p-lg border border-outline-variant/30 shadow-2xl mx-auto">
            <div className="w-10 h-1 rounded-full bg-outline-variant mx-auto mb-lg md:hidden"></div>
            <h3 className="font-headline-md text-primary mb-lg">Nuevo Hito</h3>
            <div className="space-y-md">
              <div>
                <label className="text-label-md text-on-surface-variant block mb-1">Nombre</label>
                <input value={newItemForm.name} onChange={e => setNewItemForm({...newItemForm, name:e.target.value})}
                  placeholder="Ej: Meditación, Lectura..."
                  className="w-full border-b border-outline-variant/50 focus:border-primary bg-transparent py-2 outline-none text-body-lg text-on-surface transition-colors" />
              </div>
              <div>
                <label className="text-label-md text-on-surface-variant block mb-1">Categoría</label>
                <select value={newItemForm.category} onChange={e => setNewItemForm({...newItemForm, category:e.target.value})}
                  className="w-full bg-surface-container border border-outline-variant/50 rounded-xl px-md py-sm text-body-md text-on-surface focus:outline-none focus:border-primary">
                  <option value="salud">💪 Salud</option>
                  <option value="trabajo">💼 Trabajo</option>
                  <option value="personal">🎯 Personal</option>
                  <option value="finanzas">💰 Finanzas</option>
                </select>
              </div>
              <label className="flex items-center gap-3 cursor-pointer">
                <input type="checkbox" checked={newItemForm.hasValue}
                  onChange={e => setNewItemForm({...newItemForm, hasValue:e.target.checked})}
                  className="w-5 h-5 rounded accent-primary" />
                <span className="text-body-md text-on-surface">Admite valores numéricos</span>
              </label>
            </div>
            <div className="flex gap-sm mt-xl">
              <button onClick={() => setNewItemModal(false)}
                className="flex-1 py-3 border border-outline-variant/50 rounded-xl text-label-md font-medium text-on-surface-variant hover:bg-surface-container transition-colors active:scale-95">
                Cancelar
              </button>
              <button onClick={saveNewItem}
                className="flex-1 py-3 bg-primary text-on-primary rounded-xl text-label-md font-bold shadow-sm active:scale-95 transition-transform">
                Guardar
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Edit Item Modal */}
      {editItem && (
        <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center"
          onClick={e => { if (e.target === e.currentTarget) setEditItem(null); }}>
          <div className="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
          <div className="relative w-full max-w-[400px] bg-surface-container-lowest rounded-t-2xl md:rounded-2xl p-lg border border-outline-variant/30 shadow-2xl mx-auto">
            <div className="w-10 h-1 rounded-full bg-outline-variant mx-auto mb-lg md:hidden"></div>
            <h3 className="font-headline-md text-primary mb-lg">Editar Hito</h3>
            <div className="space-y-md">
              <div>
                <label className="text-label-md text-on-surface-variant block mb-1">Nombre</label>
                <input value={editItem.name} onChange={e => setEditItem({...editItem, name:e.target.value})}
                  className="w-full border-b border-outline-variant/50 focus:border-primary bg-transparent py-2 outline-none text-body-lg text-on-surface transition-colors" />
              </div>
              <div>
                <label className="text-label-md text-on-surface-variant block mb-1">Categoría</label>
                <select value={editItem.category} onChange={e => setEditItem({...editItem, category:e.target.value})}
                  className="w-full bg-surface-container border border-outline-variant/50 rounded-xl px-md py-sm text-body-md text-on-surface focus:outline-none focus:border-primary">
                  <option value="salud">💪 Salud</option>
                  <option value="trabajo">💼 Trabajo</option>
                  <option value="personal">🎯 Personal</option>
                  <option value="finanzas">💰 Finanzas</option>
                </select>
              </div>
              <label className="flex items-center gap-3 cursor-pointer">
                <input type="checkbox" checked={editItem.hasValue}
                  onChange={e => setEditItem({...editItem, hasValue:e.target.checked})}
                  className="w-5 h-5 rounded accent-primary" />
                <span className="text-body-md text-on-surface">Admite valores numéricos</span>
              </label>
            </div>
            <div className="flex gap-sm mt-xl">
              <button onClick={deleteItem}
                className="py-3 px-md border border-error/30 text-error rounded-xl text-label-md font-medium hover:bg-error-container/20 transition-colors active:scale-95">
                <span className="material-symbols-outlined text-[18px]">delete</span>
              </button>
              <button onClick={() => setEditItem(null)}
                className="flex-1 py-3 border border-outline-variant/50 rounded-xl text-label-md font-medium text-on-surface-variant active:scale-95">
                Cancelar
              </button>
              <button onClick={saveEditItem}
                className="flex-1 py-3 bg-primary text-on-primary rounded-xl text-label-md font-bold shadow-sm active:scale-95 transition-transform">
                Guardar
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── TASKS ───────────────────────────────────────────────────────────────────
function TasksTab({ state, dispatch }) {
  const { tasks } = state;
  const [search, setSearch] = useState('');
  const [filterCat, setFilterCat] = useState('todas');
  const [filterPri, setFilterPri] = useState('todas');
  const [showAdd, setShowAdd] = useState(false);
  const [newTask, setNewTask] = useState({ name:'', category:'trabajo', priority:'urgentes' });

  const filtered = useMemo(() => {
    return tasks.filter(t => {
      if (search && !t.name.toLowerCase().includes(search.toLowerCase())) return false;
      if (filterCat !== 'todas' && t.category !== filterCat) return false;
      if (filterPri !== 'todas' && t.priority !== filterPri) return false;
      return true;
    });
  }, [tasks, search, filterCat, filterPri]);

  const distrib = useMemo(() => {
    const pending = tasks.filter(t => !t.done);
    return {
      trabajo:  pending.filter(t => t.category === 'trabajo').length,
      proyecto: pending.filter(t => t.category === 'proyecto').length,
      personal: pending.filter(t => t.category === 'personal').length,
    };
  }, [tasks]);

  const totalPending = distrib.trabajo + distrib.proyecto + distrib.personal;
  const maxDist = Math.max(distrib.trabajo, distrib.proyecto, distrib.personal, 1);

  const addTask = () => {
    if (!newTask.name.trim()) return;
    dispatch({ type:'ADD_TASK', task:{ id:uid(), ...newTask, done:false, createdAt:new Date().toISOString().slice(0,10) } });
    setNewTask({ name:'', category:'trabajo', priority:'urgentes' });
    setShowAdd(false);
  };

  const catChips = [
    { id:'todas', label:'Todas' },
    { id:'trabajo', label:'Trabajo' },
    { id:'proyecto', label:'Proyecto' },
    { id:'personal', label:'Personal' },
  ];
  const priChips = [
    { id:'todas', label:'Todas' },
    { id:'urgentes', label:'Urgentes' },
    { id:'importantes', label:'Importantes' },
    { id:'otras', label:'Otras' },
  ];

  const priorityBadge = (p) => {
    if (p === 'urgentes')    return 'bg-secondary-fixed/60 text-on-secondary-fixed';
    if (p === 'importantes') return 'bg-primary-fixed/60 text-on-primary-fixed';
    return 'bg-surface-container-high text-on-surface-variant';
  };

  return (
    <div className="tab-content space-y-lg">
      {/* Header */}
      <header className="border-b border-outline-variant/30 pb-4">
        <p className="font-mono text-[10px] tracking-widest text-on-surface-variant/60 uppercase mb-1">PÁG. 2</p>
        <h1 className="text-headline-lg-mobile md:text-headline-lg font-bold text-primary tracking-tight">Tareas</h1>
      </header>

      {/* Search */}
      <div className="relative">
        <span className="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">search</span>
        <input value={search} onChange={e => setSearch(e.target.value)}
          placeholder="Buscar tareas..."
          className="w-full h-11 pl-10 pr-4 bg-surface-container-low border-none rounded-xl text-body-md focus:outline-none focus:ring-1 focus:ring-primary placeholder:text-outline" />
      </div>

      {/* Category Chips */}
      <div className="flex gap-2 overflow-x-auto no-scrollbar -mx-md px-md">
        {catChips.map(c => (
          <button key={c.id} onClick={() => setFilterCat(c.id)}
            className={`px-4 py-1.5 rounded-full text-label-md whitespace-nowrap active:scale-95 transition-all ${
              filterCat === c.id ? 'bg-primary text-on-primary shadow-sm' : 'bg-surface-container text-on-surface-variant hover:bg-surface-variant/50'
            }`}>{c.label}</button>
        ))}
      </div>

      {/* Priority Chips */}
      <div className="flex gap-2 overflow-x-auto no-scrollbar -mx-md px-md">
        {priChips.map(c => (
          <button key={c.id} onClick={() => setFilterPri(c.id)}
            className={`px-4 py-1.5 rounded-full text-label-md whitespace-nowrap active:scale-95 transition-all ${
              filterPri === c.id ? 'bg-primary-container text-on-primary-container shadow-sm' : 'bg-surface-container text-on-surface-variant hover:bg-surface-variant/50'
            }`}>{c.label}</button>
        ))}
      </div>

      {/* Distribution */}
      {totalPending > 0 && (
        <div className="bg-surface-container-lowest border border-outline-variant/50 rounded-xl p-lg">
          <h2 className="text-label-sm font-bold text-on-surface-variant uppercase tracking-widest mb-4">Distribución Pendientes</h2>
          <div className="space-y-3">
            {[['Trabajo', distrib.trabajo], ['Proyecto', distrib.proyecto], ['Personal', distrib.personal]].map(([label, count]) => (
              <div key={label} className="space-y-1.5">
                <div className="flex justify-between items-end">
                  <span className="text-body-md font-medium text-on-surface">{label}</span>
                  <span className="text-label-md font-bold text-primary">{count}</span>
                </div>
                <div className="h-2 w-full bg-surface-container rounded-full overflow-hidden">
                  <div className="h-full bg-primary rounded-full transition-all duration-700"
                    style={{ width:`${Math.round((count/maxDist)*100)}%` }}></div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Task List */}
      <div className="space-y-3">
        {filtered.length === 0 && (
          <div className="text-center py-xl text-on-surface-variant/60">
            <span className="material-symbols-outlined text-[40px] mb-2 block">inbox</span>
            <p className="text-body-md">No hay tareas que coincidan</p>
          </div>
        )}
        {filtered.map(task => (
          <div key={task.id}
            className={`group flex items-center bg-surface-container-lowest p-4 rounded-xl border border-outline-variant/20 hover:border-outline-variant/50 transition-all ${task.done ? 'opacity-60' : ''}`}>
            <div className="flex items-center gap-3 flex-1 min-w-0">
              <label className="relative flex items-center cursor-pointer shrink-0">
                <input type="checkbox" checked={task.done}
                  onChange={() => dispatch({ type:'TOGGLE_TASK', taskId:task.id })}
                  className="w-5 h-5 rounded-full border-outline-variant accent-primary cursor-pointer" />
              </label>
              <div className="flex-1 min-w-0">
                <p className={`text-body-md text-on-surface truncate ${task.done ? 'task-checked' : ''}`}>{task.name}</p>
                <span className="text-label-sm text-outline block mt-0.5">{task.createdAt}</span>
              </div>
            </div>
            <div className="flex items-center gap-2 ml-2 shrink-0">
              <span className={`px-2 py-0.5 rounded text-label-sm ${priorityBadge(task.priority)}`}>
                {task.priority.charAt(0).toUpperCase() + task.priority.slice(1)}
              </span>
              <button onClick={() => dispatch({ type:'DELETE_TASK', taskId:task.id })}
                className="opacity-0 group-hover:opacity-100 transition-opacity text-error active:scale-90 p-1">
                <span className="material-symbols-outlined text-[18px]">delete</span>
              </button>
            </div>
          </div>
        ))}
      </div>

      {/* FAB */}
      <button onClick={() => setShowAdd(true)}
        className="fixed bottom-20 right-6 md:bottom-8 md:right-8 w-14 h-14 bg-primary text-on-primary rounded-full shadow-lg flex items-center justify-center active:scale-90 transition-transform z-40">
        <span className="material-symbols-outlined text-[28px]">add</span>
      </button>

      {/* Add Task Sheet */}
      {showAdd && (
        <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center"
          onClick={e => { if (e.target === e.currentTarget) setShowAdd(false); }}>
          <div className="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
          <div className="relative w-full max-w-[400px] bg-surface-container-lowest rounded-t-2xl md:rounded-2xl p-lg border border-outline-variant/30 shadow-2xl mx-auto">
            <div className="w-10 h-1 rounded-full bg-outline-variant mx-auto mb-lg md:hidden"></div>
            <div className="flex justify-between items-center mb-lg">
              <h3 className="font-headline-md text-primary">Nueva Tarea</h3>
              <button onClick={() => setShowAdd(false)} className="p-1 rounded-full hover:bg-surface-container transition-colors">
                <span className="material-symbols-outlined text-on-surface-variant">close</span>
              </button>
            </div>
            <div className="space-y-md">
              <div>
                <label className="text-label-md text-on-surface-variant block mb-1">Nombre de la tarea</label>
                <input value={newTask.name} onChange={e => setNewTask({...newTask,name:e.target.value})}
                  onKeyDown={e => { if(e.key==='Enter') addTask(); }}
                  placeholder="¿Qué hay que hacer?"
                  autoFocus
                  className="w-full border-b border-outline-variant/50 focus:border-primary bg-transparent py-2 outline-none text-body-lg text-on-surface placeholder:text-outline/50 transition-colors" />
              </div>
              <div>
                <label className="text-label-md text-on-surface-variant block mb-2">Categoría</label>
                <div className="flex gap-2 flex-wrap">
                  {['trabajo','proyecto','personal'].map(c => (
                    <button key={c} onClick={() => setNewTask({...newTask,category:c})}
                      className={`px-3 py-1.5 rounded-full text-label-md active:scale-95 transition-all ${
                        newTask.category===c ? 'bg-primary text-on-primary shadow-sm' : 'border border-outline-variant/50 text-on-surface-variant hover:bg-surface-variant'
                      }`}>{c.charAt(0).toUpperCase()+c.slice(1)}</button>
                  ))}
                </div>
              </div>
              <div>
                <label className="text-label-md text-on-surface-variant block mb-2">Prioridad</label>
                <div className="grid grid-cols-3 gap-2">

// ─── EVOLUTION ────────────────────────────────────────────────────────────────
function EvolutionTab({ state }) {
  const { items, history, year, month } = state;
  const [selectedItem, setSelectedItem] = useState(items[0]?.id || '');
  const [timeframe, setTimeframe] = useState('mensual');

  const item = items.find(i => i.id === selectedItem);
  const days = getDaysInMonth(year, month);

  const dayData = useMemo(() => {
    if (!item) return [];
    return Array.from({ length: days }, (_, i) => {
      const d = i + 1;
      const key = formatKey(year, month, d);
      const v = history[key]?.[item.id];
      if (v === undefined || v === null || v === false) return { d, val: 0 };
      if (item.hasValue && typeof v === 'string') {
        const n = parseFloat(v.replace(/[^\d.-]/g,''));
        return { d, val: isNaN(n) ? 1 : n };
      }
      return { d, val: 1 };
    });
  }, [item, history, year, month, days]);

  const maxVal = Math.max(...dayData.map(x => x.val), 1);
  const totalVal = dayData.reduce((s, x) => s + x.val, 0);
  const completedDays = dayData.filter(x => x.val > 0).length;
  const completionPct = Math.round((completedDays / days) * 100);

  const progressByItem = useMemo(() => {
    return items.map(it => {
      let total = 0;
      for (let d = 1; d <= days; d++) {
        const key = formatKey(year, month, d);
        const v = history[key]?.[it.id];
        if (v !== undefined && v !== null && v !== false && v !== '') {
          if (it.hasValue && typeof v === 'string') {
            const n = parseFloat(v.replace(/[^\d.-]/g,''));
            if (!isNaN(n)) total += n; else total++;
          } else total++;
        }
      }
      const maxPossible = it.hasValue ? Math.max(total, 1) : days;
      return { ...it, total: Math.round(total * 10) / 10, pct: Math.min(Math.round((total / maxPossible) * 100), 100) };
    });
  }, [items, history, year, month, days]);

  // SVG chart
  const chartW = 300, chartH = 100, padX = 0, padY = 10;
  const pts = dayData.map((x, i) => {
    const cx = padX + (i / (days - 1)) * (chartW - padX * 2);
    const cy = padY + (1 - x.val / maxVal) * (chartH - padY * 2);
    return [cx, cy];
  });
  const linePath = pts.length > 1 ? `M ${pts.map(p => p.join(',')).join(' L ')}` : '';
  const areaPath = pts.length > 1 ? `M ${pts[0][0]},${chartH} L ${pts.map(p => p.join(',')).join(' L ')} L ${pts[pts.length-1][0]},${chartH} Z` : '';

  return (
    <div className="tab-content space-y-lg">
      <header className="border-b border-outline-variant/30 pb-4">
        <p className="font-mono text-[10px] tracking-widest text-on-surface-variant/60 uppercase mb-1">PÁG. 4</p>
        <h1 className="text-headline-lg-mobile md:text-headline-lg font-bold text-primary tracking-tight">Evolución</h1>
      </header>

      {/* Timeframe Toggle */}
      <div className="flex p-1 bg-surface-container-low border border-outline-variant/20 rounded-xl">
        {['semanal','mensual','anual'].map(tf => (
          <button key={tf} onClick={() => setTimeframe(tf)}
            className={`flex-1 py-2 text-label-md rounded-lg transition-all capitalize ${
              timeframe===tf ? 'bg-surface-container-lowest shadow-sm text-primary font-semibold' : 'text-on-surface-variant hover:opacity-80'
            }`}>{tf}</button>
        ))}
      </div>

      {/* Item selector */}
      <div>
        <label className="text-label-md text-on-surface-variant block mb-1">Hito a Analizar</label>
        <select value={selectedItem} onChange={e => setSelectedItem(e.target.value)}
          className="w-full bg-surface-container border border-outline-variant/50 rounded-xl px-md py-sm text-body-md text-on-surface focus:outline-none focus:border-primary">
          {items.map(i => <option key={i.id} value={i.id}>{i.name}</option>)}
        </select>
      </div>

      {/* Bento Grid */}
      <div className="grid grid-cols-1 md:grid-cols-12 gap-md">
        {/* Chart */}
        <div className="md:col-span-7 bg-surface-container-lowest border border-outline-variant/40 rounded-xl p-lg">
          <p className="text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Evolución Mensual</p>
          <div className="flex items-baseline gap-2 mb-md">
            <span className="text-headline-lg-mobile font-bold text-primary">{completionPct}%</span>
            <span className="text-label-sm text-secondary flex items-center gap-0.5">
              <span className="material-symbols-outlined text-[14px]">trending_up</span>
              completado
            </span>
          </div>
          <div className="w-full h-[100px]">
            <svg viewBox={`0 0 ${chartW} ${chartH}`} className="w-full h-full" preserveAspectRatio="none">
              <defs>
                <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="black" stopOpacity="0.15" />
                  <stop offset="100%" stopColor="black" stopOpacity="0" />
                </linearGradient>
              </defs>
              {areaPath && <path d={areaPath} fill="url(#chartGrad)" />}
              {linePath  && <path d={linePath} fill="none" stroke="black" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />}
              {pts.filter((_,i) => dayData[i].val > 0).map((p, i) => (
                <circle key={i} cx={p[0]} cy={p[1]} r="3" fill="black" />
              ))}
            </svg>
          </div>
        </div>

        {/* Completion Ring */}
        <div className="md:col-span-5 bg-surface-container-lowest border border-outline-variant/40 rounded-xl p-lg flex flex-col items-center justify-center text-center">
          <h2 className="text-label-sm text-on-surface-variant uppercase tracking-wider mb-md">Tasa de Completado</h2>
          <ProgressRing pct={completionPct} size={100} strokeWidth={9} />
          <p className="mt-md text-label-md text-primary font-bold">{completedDays} de {days} días</p>
          {item?.hasValue && <p className="text-label-sm text-on-surface-variant mt-1">Total: {Math.round(totalVal * 10) / 10}</p>}
        </div>

        {/* Progress by item */}
        <div className="md:col-span-12 space-y-md">
          <h2 className="font-headline-md text-primary">Progreso de Hitos</h2>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-md">
            {progressByItem.map(it => (
              <div key={it.id} className="bg-surface-container-lowest border border-outline-variant/40 rounded-xl p-md flex flex-col gap-sm">
                <div className="flex justify-between items-start">
                  <div className="flex items-center gap-sm">
                    <div className="w-9 h-9 rounded-lg bg-surface-container-high flex items-center justify-center">
                      <span className="material-symbols-outlined text-primary text-[18px]">
                        {it.category==='salud' ? 'fitness_center' : it.category==='finanzas' ? 'payments' : 'star'}
                      </span>
                    </div>
                    <div>
                      <h3 className="text-body-md font-bold text-primary">{it.name}</h3>
                      <p className="text-label-sm text-on-surface-variant">{it.total} {it.hasValue ? 'total' : 'días'}</p>
                    </div>
                  </div>
                  <span className="text-label-md font-bold text-primary">{it.pct}%</span>
                </div>
                <div className="w-full h-2 bg-surface-container-high rounded-full overflow-hidden">
                  <div className="h-full bg-primary rounded-full transition-all duration-700" style={{ width:`${it.pct}%` }}></div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── SETTINGS ────────────────────────────────────────────────────────────────
function SettingsTab({ state, dispatch }) {
  const exportData = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `productive_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  };

  const importData = () => {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.json';
    input.onchange = e => {
      const f = e.target.files[0];
      const reader = new FileReader();
      reader.onload = ev => {
        try { dispatch({ type:'IMPORT', data: JSON.parse(ev.target.result) }); alert('Datos importados correctamente.'); }
        catch { alert('Error al importar: JSON inválido.'); }
      };
      reader.readAsText(f);
    };
    input.click();
  };

  const resetData = () => {
    if (confirm('¿Estás seguro de que quieres reiniciar todos los datos? Esta acción no se puede deshacer.')) {
      dispatch({ type:'RESET' });
    }
  };

  return (
    <div className="tab-content space-y-xl">
      <header className="border-b border-outline-variant/30 pb-4">
        <p className="font-mono text-[10px] tracking-widest text-on-surface-variant/60 uppercase mb-1">PÁG. 5</p>
        <h1 className="text-headline-lg-mobile md:text-headline-lg font-bold text-primary tracking-tight">Ajustes</h1>
      </header>

      {/* Account */}

        <h2 className="text-label-sm text-on-surface-variant uppercase tracking-widest mb-md">Cuenta</h2>
        <div className="bg-surface-container-lowest border border-outline-variant/50 rounded-xl p-lg flex items-center gap-lg">
          <div className="w-14 h-14 rounded-full bg-surface-container-high flex items-center justify-center shrink-0">
            <span className="material-symbols-outlined text-[28px] text-on-surface-variant icon-fill">account_circle</span>
          </div>
          <div>
            <p className="font-semibold text-primary">Usuario</p>
            <p className="text-body-md text-on-surface-variant">productive.app</p>
          </div>
          <span className="material-symbols-outlined text-on-surface-variant ml-auto">chevron_right</span>
        </div>
      </section>

      {/* Appearance */}
      <section>
        <h2 className="text-label-sm text-on-surface-variant uppercase tracking-widest mb-md">Apariencia</h2>
        <div className="grid grid-cols-2 gap-md">
          {[['light','Claro','light_mode'], ['dark','Oscuro','dark_mode']].map(([val, label, icon]) => (
            <button key={val} onClick={() => dispatch({ type:'SET_THEME', theme:val })}
              className={`relative flex flex-col gap-sm p-base border-2 rounded-xl overflow-hidden transition-all active:scale-95 ${
                state.theme===val ? 'border-primary' : 'border-outline-variant/30 hover:border-outline-variant'

                <span className={`material-symbols-outlined ${val==='light' ? 'text-on-surface-variant' : 'text-on-primary-container'}`}>{icon}</span>
              </div>
              <span className={`text-label-md text-center pb-sm ${state.theme===val ? 'text-primary font-semibold' : 'text-on-surface-variant'}`}>{label}</span>
              {state.theme===val && (
                <div className="absolute top-2 right-2 w-5 h-5 bg-primary rounded-full flex items-center justify-center">
                  <span className="material-symbols-outlined text-[12px] text-white icon-fill">check</span>

// ─── REDUCER ─────────────────────────────────────────────────────────────────
function reducer(state, action) {
  switch(action.type) {
    case 'SET_HISTORY': {
      const h = { ...state.history };
      if (!h[action.dateStr]) h[action.dateStr] = {};
      else h[action.dateStr] = { ...h[action.dateStr] };
      h[action.dateStr][action.itemId] = action.value;
      return { ...state, history: h };
    }
    case 'ADD_ITEM':    return { ...state, items: [...state.items, action.item] };
    case 'EDIT_ITEM':   return { ...state, items: state.items.map(i => i.id===action.item.id ? action.item : i) };
    case 'DELETE_ITEM': return { ...state, items: state.items.filter(i => i.id!==action.itemId) };
    case 'ADD_TASK':    return { ...state, tasks: [action.task, ...state.tasks] };
    case 'TOGGLE_TASK': return { ...state, tasks: state.tasks.map(t => t.id===action.taskId ? {...t,done:!t.done} : t) };
    case 'DELETE_TASK': return { ...state, tasks: state.tasks.filter(t => t.id!==action.taskId) };
    case 'PREV_MONTH': {
      let m = state.month - 1, y = state.year;
      if (m < 0) { m = 11; y--; }
      return { ...state, month:m, year:y };
    }
    case 'NEXT_MONTH': {
      let m = state.month + 1, y = state.year;
      if (m > 11) { m = 0; y++; }
      return { ...state, month:m, year:y };
    }
    case 'SET_THEME': {
      const html = document.documentElement;
      if (action.theme === 'dark') html.classList.add('dark'); else html.classList.remove('dark');
      return { ...state, theme:action.theme };
    }
    case 'IMPORT': return { ...INITIAL_STATE, ...action.data };
    case 'RESET':  return { ...INITIAL_STATE };
    default: return state;
  }
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState('home');
  const [state, dispatch] = React.useReducer(reducer, null, loadState);

  useEffect(() => { saveState(state); }, [state]);

  // Apply theme on load
  useEffect(() => {
    if (state.theme === 'dark') document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  }, []);

  const renderTab = () => {
    switch(tab) {
      case 'home':      return <HomeTab state={state} setTab={setTab} />;
      case 'tracker':   return <TrackerTab state={state} dispatch={dispatch} />;
      case 'tasks':     return <TasksTab state={state} dispatch={dispatch} />;

      default:          return <HomeTab state={state} setTab={setTab} />;

  return (

            <div className="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center">

            </div>

        {/* Desktop Top Bar */}
        <header className="hidden md:flex items-center justify-between px-gutter h-20 bg-surface/70 backdrop-blur-xl border-b border-outline-variant/30 sticky top-0 z-40">
          <div>
            <p className="font-mono text-[10px] tracking-widest text-on-surface-variant/60 uppercase">
              {tab === 'home' ? 'PÁG. 1' : tab === 'tracker' ? 'PÁG. 2' : tab === 'tasks' ? 'PÁG. 3' : tab === 'evolution' ? 'PÁG. 4' : 'PÁG. 5'}
            </p>
            <h1 className="text-headline-lg font-bold text-primary tracking-tight capitalize">
              {tab === 'home' ? 'Home' : tab === 'tracker' ? 'Tracker' : tab === 'tasks' ? 'Tareas' : tab === 'evolution' ? 'Evolución' : 'Ajustes'}
            </h1>
          </div>
          <div className="flex items-center gap-4">
            <button className="hover:bg-surface-container-high rounded-full p-2 transition-colors">
              <span className="material-symbols-outlined text-on-surface-variant">search</span>
            </button>
            <div className="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center border border-outline-variant/50">
              <span className="material-symbols-outlined text-on-surface-variant icon-fill">account_circle</span>
            </div>

        </header>

        {/* Main Content */}
        <main className="flex-1 max-w-4xl w-full mx-auto px-md md:px-lg py-lg pb-24 md:pb-12" key={tab}>
          {renderTab()}

      <BottomNav tab={tab} setTab={setTab} />

}

root.render(<App />);
